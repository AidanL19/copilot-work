<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Layout Recreation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet">
  <style>
    body { font-family: "Times New Roman", Times, serif; }
    .page-shell { min-height: 100vh; padding: 28px; background: #fff; }
    .topbar, .site-header, .site-footer, .aside, .content { color: #111; font-weight: 700; }
    .topbar { color: #fff; }
    .topbar { min-height: 72px; background: #3100ff; }
    .site-header { min-height: 56px; background: #f4654c; }
    .aside-left { background: #f5d500; }
    .content { background: #54b9f5; }
    .aside-right { background: #ef65b9; }
    .site-footer { min-height: 56px; background: #99e68b; }
    .middle-row { flex: 1; }
    .aside, .content { min-height: 180px; }
    .bar-title { color: #fff; letter-spacing: .2px; }
    .topbar-links { right: 1rem; }
    .topbar-links a { color: #fff; text-decoration: none; font-weight: 700; }
    .topbar-links i { font-size: 1.05rem; line-height: 1; }
    .hero-copy { max-width: 40rem; line-height: 1.12; }
    @media (min-width: 768px) {
      .middle-row { min-height: 540px; }
      .aside, .content { min-height: 540px; }
      .hero-copy { margin-top: 1.75rem; margin-left: 1.75rem; }
    }
  </style>
</head>
<body>
  <div class="page-shell d-flex flex-column">
    <nav class="topbar position-relative d-flex align-items-center justify-content-center rounded-0">
      <div class="bar-title position-absolute top-50 start-50 translate-middle fs-4">Link</div>
      <div class="topbar-links position-absolute top-50 end-0 translate-middle-y d-flex align-items-center gap-3 me-3 flex-wrap justify-content-end">
        <a href="#home" aria-label="Home"><i class="lni lni-home me-1"></i><span class="d-none d-sm-inline">Home</span></a>
        <a href="#work" aria-label="Work"><i class="lni lni-layout me-1"></i><span class="d-none d-sm-inline">Work</span></a>
        <a href="#contact" aria-label="Contact"><i class="lni lni-envelope me-1"></i><span class="d-none d-sm-inline">Contact</span></a>
      </div>
    </nav>

    <header class="site-header d-flex align-items-center justify-content-center fs-4 rounded-0">Header</header>

    <div class="row g-0 middle-row">
      <aside class="aside aside-left col-12 col-md-2 d-flex align-items-start justify-content-center pt-3 fs-4 rounded-0">Aside 1</aside>

      <main class="content col-12 col-md-8 d-flex align-items-start rounded-0">
        <p class="hero-copy fs-3 ms-3 ms-md-5 mt-4 mt-md-5 mb-0">
          The desert sky was blood red. She held on tight, as we sped, through the Valley of the Dead Vultures, into an underworld of sub-culture.
        </p>
      </main>

      <aside class="aside aside-right col-12 col-md-2 d-flex align-items-start justify-content-center pt-3 fs-4 rounded-0">Aside 2</aside>
    </div>

    <footer class="site-footer d-flex align-items-center justify-content-center fs-4 rounded-0">Footer</footer>
  </div>
</body>
</html>
